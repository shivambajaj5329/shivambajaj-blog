<!-- Projects section styling -->
<style>
/* Push the nav edge-to-edge: title at the left edge of the viewport,
   menu at the right edge. The walking dog lives in between. */
.nav {
    max-width: none !important;
    padding-left: 1.5rem;
    padding-right: 1.5rem;
    align-items: center;
}

.nav .logo,
.nav #menu {
    margin: auto 0 !important;
}


/* Widen the main container on Home + Projects + About pages */
body:has(.home-intro),
body:has(.project-grid),
body:has(.project-single),
body:has(.about-page) {
    --main-width: 1080px;
}

/* ---- Home page ---- */
.home-intro {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 1.75rem;
    align-items: center;
    margin: 1rem 0 3rem 0;
}

/* Shift the intro block left of the page grid on wide viewports
   so the avatar + name don't line up with "Featured projects" below */
@media (min-width: 1140px) {
    .home-intro {
        margin-left: -5rem;
    }
}

.home-intro-avatar {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: block;
}

.home-intro-text h1 {
    margin: 0 0 0.5rem 0;
    font-size: 1.85rem;
    color: var(--primary);
    line-height: 1.2;
}

.home-intro-tagline {
    margin: 0 0 0.85rem 0;
    color: var(--secondary);
    font-size: 1.05rem;
    line-height: 1.55;
    max-width: 56ch;
}

.home-intro-focus {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
}

.home-section {
    margin: 3rem 0;
}

.home-section-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.25rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
}

.home-section-header h2 {
    margin: 0;
    font-size: 1.25rem;
    color: var(--primary);
    border: none;
    padding: 0;
}

.home-section-cta {
    font-size: 0.9rem;
    color: var(--secondary);
    text-decoration: none;
    transition: color 0.15s ease;
}

.home-section-cta:hover {
    color: var(--primary);
}

@media (max-width: 640px) {
    .home-intro {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 1.25rem;
    }

    .home-intro-avatar {
        margin: 0 auto;
    }

    .home-intro-focus {
        justify-content: center;
    }

    .home-intro-tagline {
        margin-left: auto;
        margin-right: auto;
    }
}

/* ---- Post cards (home + /posts/) ---- */
.post-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.25rem;
    margin: 1.5rem 0;
}

.post-card {
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}

.post-card:hover {
    transform: translateY(-2px);
    border-color: var(--primary);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
}

.post-card-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    color: var(--secondary);
    margin-bottom: 0.75rem;
}

.post-card-dot {
    opacity: 0.5;
}

.post-card-draft {
    color: var(--primary);
    font-weight: 500;
}

.post-card-title {
    margin: 0 0 0.6rem 0;
    font-size: 1.3rem;
    color: var(--primary);
    line-height: 1.3;
}

.post-card-summary {
    margin: 0 0 1rem 0;
    color: var(--secondary);
    line-height: 1.55;
    flex: 1;
}

.post-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: auto;
}

/* ---- Page header for list pages ---- */
.page-header {
    margin: 1rem 0 2rem 0;
}

.page-header h1 {
    margin: 0 0 0.5rem 0;
    font-size: 1.85rem;
}

.page-description {
    margin: 0;
    color: var(--secondary);
    font-size: 1.05rem;
}

/* ---- Single post polish ---- */
.post-content pre {
    border-radius: 8px;
    padding: 1rem 1.1rem;
    border: 1px solid var(--border);
}

.post-content code {
    border-radius: 4px;
    padding: 0.1rem 0.35rem;
    font-size: 0.9em;
}

.post-content pre code {
    padding: 0;
    background: transparent;
    border: none;
}

.post-content blockquote {
    border-left: 3px solid var(--primary);
    background: var(--entry);
    padding: 0.75rem 1.1rem;
    margin: 1.25rem 0;
    border-radius: 0 6px 6px 0;
    color: var(--secondary);
    font-style: normal;
}

.post-content blockquote p:last-child {
    margin-bottom: 0;
}

.post-content table {
    border-collapse: collapse;
    margin: 1.25rem 0;
}

.post-content table th,
.post-content table td {
    padding: 0.6rem 0.85rem;
    border: 1px solid var(--border);
}

.post-content table th {
    background: var(--entry);
    font-weight: 600;
}

/* Prettier TOC */
.toc {
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.85rem 1.1rem;
    margin: 1.5rem 0;
}

.toc summary,
.toc details summary {
    font-weight: 600;
    color: var(--primary);
    cursor: pointer;
    list-style: none;
    padding: 0;
}

.toc ul {
    margin: 0.5rem 0 0 0;
    padding-left: 1.25rem;
}

.toc li {
    margin: 0.25rem 0;
}

.toc a {
    color: var(--secondary);
    text-decoration: none;
}

.toc a:hover {
    color: var(--primary);
}

/* Post nav links (prev/next at bottom of single post) */
.paginav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-top: 2.5rem;
}

.paginav a {
    padding: 1rem 1.1rem;
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    transition: border-color 0.15s ease, transform 0.15s ease;
}

.paginav a:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
}

.paginav .title {
    color: var(--primary);
    font-weight: 500;
    display: block;
    margin-top: 0.25rem;
}

.paginav .prev .title::before {
    content: "← ";
}

.paginav .next {
    text-align: right;
}

.paginav .next .title::after {
    content: " →";
}

@media (max-width: 640px) {
    .paginav {
        grid-template-columns: 1fr;
    }

    .paginav .next {
        text-align: left;
    }
}

/* ---- Footer social icons ---- */
.footer-social {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-top: 0.5rem;
}

.footer-social a {
    color: var(--secondary);
    transition: color 0.15s ease;
    display: inline-flex;
    align-items: center;
}

.footer-social a:hover {
    color: var(--primary);
}

.footer-social svg {
    width: 18px;
    height: 18px;
}

/* ---- About page ---- */
.about-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.5rem;
    margin: 2rem 0 2.5rem 0;
}

.about-hero-photo {
    margin-bottom: 1.25rem;
}

.about-hero-photo img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: block;
}

.about-name {
    margin: 0 0 0.4rem 0;
    font-size: 2.2rem;
    color: var(--primary);
    line-height: 1.2;
}

.about-role {
    margin: 0 0 0.15rem 0;
    color: var(--secondary);
    font-size: 1.05rem;
}

.about-location {
    margin: 0 0 0.5rem 0;
    color: var(--secondary);
    font-size: 0.95rem;
}

.about-focus {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.4rem;
    margin-top: 0.85rem;
}

.about-bio {
    max-width: 640px;
    margin: 0 auto;
    font-size: 1.05rem;
    line-height: 1.75;
}

.about-bio p {
    margin-bottom: 1.1rem;
}

.about-contact {
    max-width: 640px;
    margin: 3rem auto 0 auto;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    text-align: center;
}

.about-contact h2 {
    margin: 0 0 1rem 0;
    font-size: 0.8rem;
    color: var(--secondary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
    border: none;
    padding: 0;
}

.about-contact-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.75rem;
}

.about-contact-links a {
    font-weight: 500;
    text-decoration: none;
    padding: 0.55rem 1rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    color: inherit;
}

.about-contact-links a:hover {
    border-color: var(--primary);
    background: var(--code-bg);
    transform: translateY(-1px);
}

@media (max-width: 640px) {
    .about-hero-photo img {
        width: 160px;
        height: 160px;
    }

    .about-name {
        font-size: 1.85rem;
    }
}

.projects-intro {
    font-size: 1.05rem;
    color: var(--secondary);
    margin-bottom: 2rem;
}

.project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.25rem;
    margin: 2rem 0;
}

.project-card {
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}

.project-card:hover {
    transform: translateY(-2px);
    border-color: var(--primary);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
}

.project-card-status {
    display: inline-block;
    align-self: flex-start;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--secondary);
    padding: 0.2rem 0.55rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    margin-bottom: 0.75rem;
}

.project-card-title {
    margin: 0 0 0.5rem 0;
    font-size: 1.4rem;
    color: var(--primary);
}

.project-card-tagline {
    margin: 0 0 1rem 0;
    color: var(--secondary);
    line-height: 1.5;
    flex: 1;
}

.project-card-tech,
.project-tech {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 0.5rem 0 0.75rem 0;
}

.tech-tag {
    font-size: 0.75rem;
    padding: 0.15rem 0.55rem;
    background: var(--code-bg);
    color: var(--secondary);
    border-radius: 4px;
    font-family: var(--font-mono, monospace);
}

.project-card-cta {
    margin-top: 0.75rem;
    color: var(--primary);
    font-weight: 500;
    font-size: 0.95rem;
}

/* Project detail page */
.project-single .post-header {
    margin-bottom: 1.5rem;
}

.project-status {
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--secondary);
    padding: 0.2rem 0.55rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    margin-bottom: 1rem;
}

.project-tagline {
    font-size: 1.15rem;
    color: var(--secondary);
    line-height: 1.55;
    margin: 0.5rem 0 1rem 0;
}

.project-links {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
}

.project-links a {
    font-weight: 500;
    text-decoration: none;
    padding: 0.45rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: border-color 0.15s ease, background 0.15s ease;
}

.project-links a:hover {
    border-color: var(--primary);
    background: var(--code-bg);
}

.project-embed {
    margin: 2rem 0;
}

/* Phone-frame embed for mobile-first projects */
.phone-embed {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.phone-frame {
    position: relative;
    width: 390px;
    max-width: 100%;
    padding: 14px 14px 18px;
    background: linear-gradient(160deg, #2a2a2e 0%, #131316 100%);
    border-radius: 52px;
    box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.35),
        0 0 0 1.5px rgba(255, 255, 255, 0.05),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
}

/* Dynamic Island — floating pill that sits over the screen */
.phone-notch {
    position: absolute;
    top: 26px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 33px;
    background: #000;
    border-radius: 999px;
    z-index: 2;
    pointer-events: none;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04);
}

/* Tiny camera dot on the right side of the island */
.phone-notch::after {
    content: "";
    position: absolute;
    top: 50%;
    right: 12px;
    transform: translateY(-50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #1a1a1d;
    box-shadow: inset 0 0 0 1.5px #050507, inset 0 0 0 2.5px rgba(60, 80, 120, 0.4);
}

.phone-frame iframe {
    width: 100%;
    height: 760px;
    border: 0;
    border-radius: 40px;
    background: #f5f5f7;
    display: block;
}

@media (prefers-color-scheme: dark) {
    .phone-frame iframe {
        background: #000;
    }
}

@media (max-width: 460px) {
    .phone-frame {
        width: 100%;
        padding: 10px 10px 14px;
        border-radius: 40px;
    }
    .phone-frame iframe {
        height: 680px;
        border-radius: 32px;
    }
    .phone-notch {
        top: 20px;
        width: 100px;
        height: 28px;
    }
    .phone-notch::after {
        right: 10px;
        width: 7px;
        height: 7px;
    }
}

.embed-caption {
    text-align: center;
    font-size: 0.85rem;
    color: var(--secondary);
    margin-top: 0.5rem;
    font-style: italic;
}

.project-gallery {
    margin: 3rem 0 1rem 0;
}

.project-gallery h2 {
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.4rem;
    margin-bottom: 1.25rem;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1rem;
}

.gallery-item {
    margin: 0;
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
}

.gallery-item a {
    display: block;
}

.gallery-item img {
    display: block;
    width: 100%;
    height: auto;
    transition: opacity 0.15s ease;
}

.gallery-item:hover img {
    opacity: 0.92;
}

.gallery-item figcaption {
    padding: 0.6rem 0.85rem;
    font-size: 0.85rem;
    color: var(--secondary);
    border-top: 1px solid var(--border);
}

.back-to-projects {
    display: inline-block;
    margin-top: 2rem;
    color: var(--secondary);
    text-decoration: none;
}

.back-to-projects:hover {
    color: var(--primary);
}
/* Mermaid diagram styling */
.mermaid {
    display: flex;
    justify-content: center;
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem 1.25rem;
    margin: 1.75rem 0;
    overflow-x: auto;
}

.mermaid svg {
    max-width: 100%;
    height: auto;
}
</style>

<!-- Mermaid.js for diagrams -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

  function isDarkMode() {
    return document.documentElement.getAttribute("data-theme") === "dark" ||
           document.body.classList.contains("dark") ||
           (!document.documentElement.getAttribute("data-theme") && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  function getMermaidConfig() {
    const dark = isDarkMode();
    return {
      startOnLoad: false,
      theme: 'base',
      themeVariables: dark ? {
        darkMode: true,
        background: '#1e1e24',
        mainBkg: '#2d3139',
        nodeBorder: '#4a5568',
        nodeTextColor: '#e2e8f0',
        clusterBkg: '#1a1d24',
        clusterBorder: '#374151',
        titleColor: '#93c5fd',
        lineColor: '#60a5fa',
        edgeLabelBackground: '#1e1e24',
        textColor: '#e2e8f0',
        actorBkg: '#2d3139',
        actorBorder: '#4a5568',
        actorTextColor: '#e2e8f0',
        labelBoxBkgColor: '#2d3139',
        labelBoxBorderColor: '#4a5568',
        labelTextColor: '#e2e8f0'
      } : {
        darkMode: false,
        background: '#ffffff',
        mainBkg: '#f8fafc',
        nodeBorder: '#cbd5e1',
        nodeTextColor: '#0f172a',
        clusterBkg: '#f1f5f9',
        clusterBorder: '#cbd5e1',
        titleColor: '#1e293b',
        lineColor: '#3b82f6',
        edgeLabelBackground: '#ffffff',
        textColor: '#0f172a',
        actorBkg: '#f8fafc',
        actorBorder: '#cbd5e1',
        actorTextColor: '#0f172a'
      }
    };
  }

  function renderMermaid() {
    // Store original source if not stored yet
    document.querySelectorAll('.mermaid').forEach((el) => {
      if (!el.getAttribute('data-mermaid-src')) {
        el.setAttribute('data-mermaid-src', el.textContent.trim());
      }
      el.removeAttribute('data-processed');
      el.innerHTML = el.getAttribute('data-mermaid-src');
    });

    mermaid.initialize(getMermaidConfig());
    mermaid.run({
      querySelector: '.mermaid'
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    renderMermaid();

    const observer = new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        if (mutation.type === 'attributes' && (mutation.attributeName === 'data-theme' || mutation.attributeName === 'class')) {
          renderMermaid();
          break;
        }
      }
    });

    observer.observe(document.documentElement, { attributes: true });
    observer.observe(document.body, { attributes: true });
  });
</script>
